<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大模型 3D 技术架构图 · 十四款旗舰模型对比</title>
<style>
  :root{
    --bg:#000000;
    --nav:#08090C;
    --nav2:#0B0D11;
    --tx:#F2F4F7;
    --tx2:#8A93A3;
    --tx3:#5B6472;
    --line:rgba(255,255,255,.10);
    --line2:rgba(255,255,255,.055);
    --hot:rgba(255,255,255,.06);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    --nav-w:268px;
    --nav-w-min:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased;
       -webkit-user-select:none;-moz-user-select:none;user-select:none}

  #app{display:flex;height:100vh;width:100%}

  /* ---------------- 左侧导航 ---------------- */
  #nav{flex:0 0 auto;width:var(--nav-w);background:var(--nav);
       border-right:1px solid var(--line2);
       display:flex;flex-direction:column;
       transition:width .26s cubic-bezier(.22,.9,.28,1);
       overflow:hidden;position:relative;z-index:5}
  #app.min #nav{width:var(--nav-w-min)}

  .nav-top{flex:0 0 auto;display:flex;align-items:center;gap:10px;
           padding:15px 14px 13px;border-bottom:1px solid var(--line2);min-height:60px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
  .mark{flex:0 0 auto;width:26px;height:26px;border-radius:6px;display:block}
  .brand-tx{display:flex;flex-direction:column;gap:2px;min-width:0;
            transition:opacity .16s ease}
  .brand-tx b{font-size:13.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .brand-tx i{font-size:10px;color:var(--tx3);font-style:normal;white-space:nowrap}
  #app.min .brand-tx{opacity:0;pointer-events:none}

  #toggle{flex:0 0 auto;width:30px;height:30px;border-radius:6px;
          border:1px solid var(--line);background:transparent;color:var(--tx2);
          cursor:pointer;display:flex;align-items:center;justify-content:center;
          transition:background .15s,color .15s,border-color .15s}
  #toggle:hover{background:var(--hot);color:#fff;border-color:rgba(255,255,255,.24)}
  #toggle svg{width:16px;height:16px;display:block}
  #app.min .nav-top{justify-content:center;padding-left:0;padding-right:0}
  #app.min .brand{display:none}

  .list{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:10px 10px 6px}
  .list::-webkit-scrollbar{width:5px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}

  .grp{font-size:9.5px;font-family:var(--mono);letter-spacing:1.4px;color:var(--tx3);
       padding:12px 8px 7px;white-space:nowrap;transition:opacity .16s}
  #app.min .grp{opacity:0}

  .item{position:relative;width:100%;display:flex;align-items:center;gap:11px;
        padding:9px 9px;margin-bottom:3px;border:0;border-radius:7px;
        background:transparent;color:var(--tx);cursor:pointer;text-align:left;
        font-family:inherit;transition:background .15s}
  .item:hover{background:var(--hot)}
  .item.on{background:rgba(255,255,255,.075)}
  .item.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
                   border-radius:0 2px 2px 0;background:var(--c,#EF4444)}
  .item .ico{flex:0 0 auto;width:24px;height:24px;display:block}
  .item .tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto;
            transition:opacity .16s}
  .item .tx b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;
              text-overflow:ellipsis}
  .item .tx i{font-size:10px;color:var(--tx3);font-style:normal;white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis}
  .item .badge{flex:0 0 auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;
               color:var(--c,#EF4444);border:1px solid currentColor;border-radius:3px;
               padding:1px 4px;opacity:.85}
  #app.min .item{justify-content:center;padding:9px 0}
  #app.min .item .tx,#app.min .item .badge{opacity:0;width:0;overflow:hidden}
  #app.min .item.on::before{top:6px;bottom:6px}

  .nav-bot{flex:0 0 auto;padding:11px 12px 14px;border-top:1px solid var(--line2)}
  .nav-bot span{font-size:9.5px;font-family:var(--mono);color:var(--tx3);line-height:1.7;
                display:block;white-space:nowrap;overflow:hidden;transition:opacity .16s}
  #app.min .nav-bot span{opacity:0}

  /* ---------------- 右侧内容 ---------------- */
  #content{flex:1 1 auto;position:relative;min-width:0;background:#000}
  .pane{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;
        background:#000}
  .pane.on{display:block}

  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        gap:10px;background:#000;color:var(--tx3);font-size:12px;
        font-family:var(--mono);letter-spacing:.4px;z-index:3;transition:opacity .3s}
  #boot.off{opacity:0;pointer-events:none}
  #boot .sp{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);
            border-top-color:#EF4444;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}

  /* 折叠状态下的悬停提示 */
  #app.min .item .hint{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
        background:#15181E;border:1px solid var(--line);border-radius:6px;
        padding:5px 9px;font-size:11px;color:var(--tx);white-space:nowrap;
        opacity:0;pointer-events:none;transition:opacity .14s;z-index:9;
        box-shadow:0 6px 22px rgba(0,0,0,.6)}
  #app.min .item:hover .hint{opacity:1}
  .item .hint{display:none}
  #app.min .item .hint{display:block}

  @media (max-width:760px){ :root{--nav-w:220px} }
</style>
</head>
<body>

<div id="app">

  <aside id="nav">
    <div class="nav-top">
      <div class="brand">
        <span class="mark" id="mark"></span>
        <span class="brand-tx">
          <b>大模型3D架构图</b>
          <i>大模型结构可视化</i>
        </span>
      </div>
      <button id="toggle" aria-label="折叠 / 展开侧栏" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2.5"/>
          <line x1="9.5" y1="4" x2="9.5" y2="20"/>
        </svg>
      </button>
    </div>

    <nav class="list" id="list"></nav>

    <div class="nav-bot">
      <span>拖动旋转 · 滚轮缩放 · 空格演示</span>
      <span>放大 150% 后点色块可展开内部</span>
    </div>
  </aside>

  <main id="content">
    <iframe class="pane" id="pane-gemini" title="Gemini 3.5 Flash 技术架构"></iframe>
    <iframe class="pane" id="pane-fable" title="Claude Fable 5.1 技术架构"></iframe>
    <iframe class="pane" id="pane-gpt6" title="GPT-6 Astra 技术架构"></iframe>
    <iframe class="pane" id="pane-doubao" title="Doubao-Seed-2.1-pro 技术架构"></iframe>
    <iframe class="pane" id="pane-hy3" title="腾讯混元 Hy3 技术架构"></iframe>
    <iframe class="pane" id="pane-ernie" title="文心 5.1（ERNIE 5.1）技术架构"></iframe>
    <iframe class="pane" id="pane-llama" title="Llama 4 Maverick 技术架构"></iframe>
    <iframe class="pane" id="pane-mimo" title="MiMo-V2.5-Pro 技术架构"></iframe>
    <iframe class="pane" id="pane-grok" title="Grok 4.6 技术架构"></iframe>
    <iframe class="pane" id="pane-mm" title="MiniMax-M3 技术架构"></iframe>
    <iframe class="pane" id="pane-qwen" title="Qwen3.8-Max 技术架构"></iframe>
    <iframe class="pane" id="pane-kimi" title="Kimi K3 技术架构"></iframe>
    <iframe class="pane" id="pane-glm" title="GLM-5.3 技术架构"></iframe>
    <iframe class="pane" id="pane-ds"  title="DeepSeek-V4.1-Flash 技术架构"></iframe>
    <div id="boot"><span class="sp"></span><span id="bootTx">正在载入大模型3D架构图…</span></div>
  </main>

</div>

<script>
/* 侧栏条目。图标为「堆叠方块」的等距示意，颜色即该模型在架构图里的主强调色。 */
const MODELS = [
  { id:'gemini', name:'Gemini 3.5 Flash', sub:'Google DeepMind · 稀疏 MoE · 规模参数未公开',
    file:'gemini-35-flash-3d-architecture.html', color:'#4285F4', badge:'NEW' },
  { id:'fable', name:'Claude Fable 5.1', sub:'Anthropic · 架构未披露 · 一套权重两种配置',
    file:'claude-fable-51-3d-architecture.html', color:'#D97757', badge:'' },
  { id:'gpt6', name:'GPT-6 Astra', sub:'OpenAI · 架构未披露 · 循环层存争议',
    file:'gpt-6-astra-3d-architecture.html', color:'#10A37F', badge:'' },
  { id:'doubao', name:'Doubao-Seed-2.1-pro', sub:'字节 / 火山引擎 · 架构未公开',
    file:'doubao-seed-21-pro-3d-architecture.html', color:'#1664FF', badge:'' },
  { id:'hy3',  name:'混元 Hy3', sub:'腾讯 · 稠密-MoE 混合 + MTP + 快慢思考',
    file:'hunyuan-hy3-3d-architecture.html', color:'#0052D9', badge:'' },
  { id:'ernie', name:'文心 5.1 (ERNIE 5.1)', sub:'百度 · 弹性超网络抽取 + 模态无关 MoE',
    file:'ernie-51-3d-architecture.html', color:'#2932E1', badge:'' },
  { id:'llama', name:'Llama 4 Maverick', sub:'Meta · Early Fusion + iRoPE + 交错 MoE',
    file:'llama-4-maverick-3d-architecture.html', color:'#0866FF', badge:'' },
  { id:'mimo', name:'MiMo-V2.5-Pro', sub:'小米 · 混合注意力 6:1 + 稀疏 MoE',
    file:'mimo-v25-pro-3d-architecture.html', color:'#FF6900', badge:'' },
  { id:'grok', name:'Grok 4.6', sub:'xAI / SpaceXAI · 架构未公开',
    file:'grok-46-3d-architecture.html', color:'#64748B', badge:'' },
  { id:'mm',   name:'MiniMax-M3', sub:'稀宇科技 · MSA 稀疏注意力 + 原生多模态',
    file:'minimax-m3-3d-architecture.html', color:'#A855F7', badge:'' },
  { id:'qwen', name:'Qwen3.8-Max', sub:'阿里 · 混合注意力 + 细粒度 MoE',
    file:'qwen-38-max-3d-architecture.html', color:'#F59E0B', badge:'' },
  { id:'kimi', name:'Kimi K3', sub:'月之暗面 · KDA + AttnRes + LatentMoE',
    file:'kimi-k3-3d-architecture.html', color:'#6366F1', badge:'' },
  { id:'glm',  name:'GLM-5.3', sub:'智谱 · MoE + MLA/DSA + IndexShare',
    file:'glm-53-3d-architecture.html', color:'#2DD4BF', badge:'' },
  { id:'ds',   name:'DeepSeek-V4.1-Flash', sub:'深度求索 · CED 非对称编解码器',
    file:'deepseek-v41-flash-3d-architecture.html', color:'#EF4444', badge:'' }
];

function stackIcon(color){
  return '<svg class="ico" viewBox="0 0 24 24" fill="none">' +
    '<path d="M12 3 21 7.6 12 12.2 3 7.6 12 3Z" fill="' + color + '" fill-opacity=".92"/>' +
    '<path d="M12 9.4 21 14 12 18.6 3 14 12 9.4Z" fill="' + color + '" fill-opacity=".5"/>' +
    '<path d="M12 15.2 21 19.8 12 24.4 3 19.8 12 15.2Z" fill="' + color + '" fill-opacity=".22"/>' +
    '</svg>';
}

const app = document.getElementById('app');
const list = document.getElementById('list');
const boot = document.getElementById('boot');
const bootTx = document.getElementById('bootTx');

/* 品牌角标：三片方块，取两个模型的主色 */
document.getElementById('mark').innerHTML =
  '<svg viewBox="0 0 24 24" width="26" height="26" fill="none">' +
  '<path d="M12 2.5 21.5 7.2 12 11.9 2.5 7.2 12 2.5Z" fill="#EF4444" fill-opacity=".9"/>' +
  '<path d="M12 9.2 21.5 13.9 12 18.6 2.5 13.9 12 9.2Z" fill="#2DD4BF" fill-opacity=".62"/>' +
  '<path d="M12 15.9 21.5 20.6 12 25.3 2.5 20.6 12 15.9Z" fill="#8A93A3" fill-opacity=".28"/>' +
  '</svg>';

list.innerHTML =
  '<div class="grp">MODELS</div>' +
  MODELS.map(m =>
    '<button class="item" data-id="' + m.id + '" style="--c:' + m.color + '">' +
      stackIcon(m.color) +
      '<span class="tx"><b>' + m.name + '</b><i>' + m.sub + '</i></span>' +
      (m.badge ? '<span class="badge">' + m.badge + '</span>' : '') +
      '<span class="hint">' + m.name + '</span>' +
    '</button>').join('');

/* ---------------- 侧栏折叠 ---------------- */
const toggle = document.getElementById('toggle');
function setMin(v){
  app.classList.toggle('min', v);
  toggle.setAttribute('aria-expanded', v ? 'false' : 'true');
}
toggle.addEventListener('click', () => {
  setMin(!app.classList.contains('min'));
  toggle.blur();
  try{ localStorage.setItem('arch.nav.min', app.classList.contains('min') ? '1' : '0'); }catch(e){}
});
try{ if (localStorage.getItem('arch.nav.min') === '1') setMin(true); }catch(e){}

/* ---------------- 切换模型 ---------------- */
let current = '';
const loaded = {};

function show(id){
  const m = MODELS.find(x => x.id === id);
  if (!m || current === id) return;
  current = id;

  document.querySelectorAll('.item').forEach(b =>
    b.classList.toggle('on', b.dataset.id === id));

  /* 懒加载：首次进入某模型时才给 iframe 设 src，之后仅切换显示 */
  const pane = document.getElementById('pane-' + id);
  const first = !loaded[id];
  if (first){
    loaded[id] = true;
    boot.classList.remove('off');
    bootTx.textContent = '正在载入 ' + m.name + ' …';
    pane.addEventListener('load', () => boot.classList.add('off'), { once:true });
    pane.src = m.file;
  } else {
    boot.classList.add('off');
  }

  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  pane.classList.add('on');

  try{ localStorage.setItem('arch.model', id); }catch(e){}
}

list.addEventListener('click', e => {
  const b = e.target.closest('.item');
  if (b) show(b.dataset.id);
});

/* 默认进入 Gemini 3.5 Flash（本次新增的那套）；若上次访问过则回到上次的 */
let start = 'gemini';
try{ const last = localStorage.getItem('arch.model');
     if (last && MODELS.some(m => m.id === last)) start = last; }catch(e){}
show(start);

/* 兜底：iframe 被安全策略拦下时给出直开入口 */
setTimeout(() => {
  if (boot.classList.contains('off')) return;
  const m = MODELS.find(x => x.id === current);
  bootTx.innerHTML = '载入较慢或受限，可 <a href="' + m.file + '" target="_blank" rel="noopener">直接打开 ' + m.name + '</a>';
}, 6000);
</script>
</body>
</html>
